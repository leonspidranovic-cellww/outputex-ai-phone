<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>OUTPUTEX AI</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #0b0e14; color: #e0e0e0; overflow: hidden; height: 100vh; }
        .app { display: flex; height: 100vh; width: 100vw; background: #0d1117; }

        /* Сайдбар — скрыт на телефонах */
        .sidebar {
            width: 280px;
            background: #161b22;
            border-right: 1px solid #2a2f3a;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            overflow: hidden;
            transition: transform 0.25s ease;
            transform: translateX(0);
        }
        .sidebar-header { padding: 14px 16px; border-bottom: 1px solid #2a2f3a; display: flex; align-items: center; }
        .sidebar-header .logo-small { font-size: 18px; font-weight: 700; background: linear-gradient(135deg, #00d4ff, #7b2ffc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .sidebar-header .new-chat-btn { margin-left: auto; background: none; border: 1px solid #2a2f3a; border-radius: 30px; color: #c0c8d8; padding: 4px 14px; font-size: 13px; cursor: pointer; }
        .sidebar-header .new-chat-btn:hover { background: #2a2f3a; color: #fff; }
        .sidebar-history { flex: 1; overflow-y: auto; padding: 12px 10px; }
        .sidebar-history::-webkit-scrollbar { width: 4px; }
        .sidebar-history::-webkit-scrollbar-track { background: #161b22; }
        .sidebar-history::-webkit-scrollbar-thumb { background: #2a2f3a; border-radius: 10px; }

        .history-item { padding: 6px 10px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 6px; margin-bottom: 2px; font-size: 13px; color: #c0c8d8; }
        .history-item:hover { background: #2a2f3a; }
        .history-item.active { background: #2a2f3a; color: #fff; }
        .history-item .title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
        .history-item .meta { font-size: 11px; color: #6a7a8a; flex-shrink: 0; margin-right: 4px; }

        .main { flex: 1; display: flex; flex-direction: column; min-width: 0; background: #0d1117; }
        .header { padding: 10px 16px; background: #161b22; border-bottom: 1px solid #2a2f3a; display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
        .header .menu-btn { background: none; border: none; color: #e0e0e0; font-size: 24px; cursor: pointer; padding: 0 4px; }
        .header .logo { font-size: 18px; font-weight: 700; background: linear-gradient(135deg, #00d4ff, #7b2ffc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-right: auto; white-space: nowrap; }
        .header .online { display: flex; align-items: center; gap: 6px; color: #4caf50; font-size: 11px; margin-right: 6px; }
        .header .online::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: #4caf50; display: inline-block; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 0.4; transform: scale(0.9); } 50% { opacity: 1; transform: scale(1.2); } 100% { opacity: 0.4; transform: scale(0.9); } }
        .header .btn-icon { background: none; border: none; color: #8892a8; font-size: 18px; cursor: pointer; padding: 4px; border-radius: 6px; }
        .header .btn-icon:hover { background: #2a2f3a; color: #e0e0e0; }
        .header .google-btn { background: none; border: 1px solid #2a2f3a; border-radius: 20px; padding: 2px 10px; color: #c0c8d8; font-size: 11px; cursor: pointer; display: flex; align-items: center; gap: 4px; }

        .messages { flex: 1; overflow-y: auto; padding: 12px 12px 8px; display: flex; flex-direction: column; gap: 10px; background: #0d1117; }
        .messages::-webkit-scrollbar { width: 4px; }
        .messages::-webkit-scrollbar-track { background: #161b22; }
        .messages::-webkit-scrollbar-thumb { background: #2a2f3a; border-radius: 10px; }

        .message { display: flex; gap: 10px; max-width: 100%; }
        .message.user { align-self: flex-end; flex-direction: row-reverse; }
        .message.assistant { align-self: flex-start; }

        .message .avatar { width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 14px; background: #2a2f3a; color: #c0c8d8; }
        .message.user .avatar { background: linear-gradient(135deg, #00d4ff, #7b2ffc); color: #fff; }
        .message .bubble { background: #161b22; padding: 8px 12px; border-radius: 16px; border-top-left-radius: 4px; word-wrap: break-word; line-height: 1.5; font-size: 14px; box-shadow: 0 1px 4px rgba(0,0,0,0.4); color: #e0e0e0; max-width: 88vw; }
        .message.user .bubble { background: #1c2333; border-top-left-radius: 16px; border-top-right-radius: 4px; }

        .input-area { padding: 8px 12px 12px; background: #0d1117; border-top: 1px solid #2a2f3a; display: flex; gap: 8px; align-items: center; }
        .input-area textarea { flex: 1; background: #161b22; border: 1px solid #2a2f3a; border-radius: 30px; padding: 8px 14px; color: #e0e0e0; font-size: 14px; resize: none; outline: none; font-family: inherit; min-height: 38px; max-height: 120px; }
        .input-area textarea:focus { border-color: #7b2ffc; background: #1c2333; }
        .input-area button { background: linear-gradient(135deg, #00d4ff, #7b2ffc); border: none; border-radius: 30px; padding: 0 16px; font-weight: 600; color: #fff; font-size: 14px; cursor: pointer; min-height: 38px; }

        /* Адаптив: на телефонах сайдбар прячется */
        @media (max-width: 700px) {
            .sidebar {
                position: fixed;
                top: 0;
                left: 0;
                height: 100%;
                z-index: 100;
                width: 280px;
                max-width: 80vw;
                transform: translateX(-100%);
                transition: transform 0.25s ease;
                box-shadow: 2px 0 12px rgba(0,0,0,0.6);
            }
            .sidebar.open {
                transform: translateX(0);
            }
            .sidebar-overlay {
                display: none;
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0,0,0,0.4);
                z-index: 99;
            }
            .sidebar-overlay.open {
                display: block;
            }
            .header .menu-btn {
                display: block;
            }
        }
        @media (min-width: 701px) {
            .header .menu-btn {
                display: none;
            }
            .sidebar {
                transform: translateX(0) !important;
                position: relative;
                box-shadow: none;
            }
        }
    </style>
</head>
<body>
    <div class="app">
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <span class="logo-small">OUTPUTEX</span>
                <button class="new-chat-btn" id="newChatBtnSidebar">+ Новый</button>
            </div>
            <div class="sidebar-history" id="sidebarHistory"></div>
        </div>
        <div class="sidebar-overlay" id="sidebarOverlay"></div>

        <div class="main">
            <div class="header">
                <button class="menu-btn" id="menuBtn">☰</button>
                <span class="logo">OUTPUTEX AI</span>
                <span class="online">Онлайн</span>
                <button class="btn-icon" id="settingsBtn" title="Настройки">⚙️</button>
                <button class="google-btn" id="googleLoginBtn"><span>🔑</span> Войти</button>
            </div>
            <div class="messages" id="messages"></div>
            <div class="input-area">
                <textarea id="question" rows="1" placeholder="Спросите что угодно..."></textarea>
                <button id="sendBtn">Отправить</button>
            </div>
        </div>
    </div>

    <script>
        // Минимальный функционал для демонстрации адаптации
        // (остальные функции можно добавить позже, но для проверки интерфейса достаточно)
        const menuBtn = document.getElementById('menuBtn');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebarOverlay');

        function toggleSidebar() {
            sidebar.classList.toggle('open');
            overlay.classList.toggle('open');
        }

        menuBtn.addEventListener('click', toggleSidebar);
        overlay.addEventListener('click', toggleSidebar);

        // Сразу скрываем сайдбар на телефонах
        if (window.innerWidth <= 700) {
            sidebar.classList.remove('open');
            overlay.classList.remove('open');
        }

        // Имитация отправки (для проверки интерфейса)
        document.getElementById('sendBtn').addEventListener('click', function() {
            const input = document.getElementById('question');
            const msg = input.value.trim();
            if (!msg) return;
            const messagesDiv = document.getElementById('messages');
            const userDiv = document.createElement('div');
            userDiv.className = 'message user';
            userDiv.innerHTML = `<div class="avatar">🧑</div><div class="bubble">${msg}</div>`;
            messagesDiv.appendChild(userDiv);
            input.value = '';
            setTimeout(() => {
                const botDiv = document.createElement('div');
                botDiv.className = 'message assistant';
                botDiv.innerHTML = `<div class="avatar">🤖</div><div class="bubble">Спасибо за вопрос! Интерфейс адаптирован.</div>`;
                messagesDiv.appendChild(botDiv);
                messagesDiv.scrollTop = messagesDiv.scrollHeight;
            }, 1000);
        });
    </script>
</body>
</html>
