<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>OUTPUTEX AI</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        /* Глобальный сброс */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0b0e14;
            color: #e0e0e0;
        }
        .app {
            display: flex;
            height: 100vh;
            width: 100vw;
            background: #0d1117;
        }

        /* Сайдбар */
        .sidebar {
            width: 280px;
            max-width: 80vw;
            background: #161b22;
            border-right: 1px solid #2a2f3a;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            overflow: hidden;
            transition: transform 0.25s ease;
            transform: translateX(0);
            z-index: 10;
        }
        .sidebar-header {
            padding: 14px 16px;
            border-bottom: 1px solid #2a2f3a;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }
        .sidebar-header .logo-small {
            font-size: 18px;
            font-weight: 700;
            background: linear-gradient(135deg, #00d4ff, #7b2ffc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .sidebar-header .new-chat-btn {
            margin-left: auto;
            background: none;
            border: 1px solid #2a2f3a;
            border-radius: 30px;
            color: #c0c8d8;
            padding: 4px 14px;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
        }
        .sidebar-header .new-chat-btn:hover {
            background: #2a2f3a;
            color: #fff;
        }

        .sidebar-history {
            flex: 1;
            overflow-y: auto;
            padding: 12px 10px;
        }
        .sidebar-history::-webkit-scrollbar { width: 4px; }
        .sidebar-history::-webkit-scrollbar-track { background: #161b22; }
        .sidebar-history::-webkit-scrollbar-thumb { background: #2a2f3a; border-radius: 10px; }

        .history-group { margin-bottom: 16px; }
        .history-group .group-title {
            font-size: 11px;
            font-weight: 600;
            color: #6a7a8a;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            margin-bottom: 4px;
            padding-left: 4px;
        }

        .history-item {
            padding: 6px 10px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 2px;
            font-size: 13px;
            color: #c0c8d8;
            position: relative;
        }
        .history-item:hover { background: #2a2f3a; }
        .history-item.active { background: #2a2f3a; color: #fff; }
        .history-item .title {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }
        .history-item .meta {
            font-size: 11px;
            color: #6a7a8a;
            flex-shrink: 0;
            margin-right: 4px;
        }
        .history-item .menu-btn {
            background: none;
            border: none;
            color: #6a7a8a;
            font-size: 16px;
            cursor: pointer;
            padding: 0 4px;
            opacity: 0;
            transition: 0.15s;
        }
        .history-item:hover .menu-btn,
        .history-item.active .menu-btn { opacity: 1; }

        .dropdown-menu {
            display: none;
            position: absolute;
            right: 10px;
            top: 28px;
            background: #1c2333;
            border: 1px solid #2a2f3a;
            border-radius: 10px;
            padding: 6px 0;
            min-width: 160px;
            z-index: 200;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
        }
        .dropdown-menu.open { display: block; }
        .dropdown-menu .menu-item {
            padding: 6px 16px;
            font-size: 13px;
            color: #c0c8d8;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .dropdown-menu .menu-item:hover { background: #2a2f3a; color: #fff; }
        .dropdown-menu .menu-item.danger { color: #f87171; }

        .sidebar-empty {
            color: #6a7a8a;
            text-align: center;
            padding: 30px 0;
            font-size: 14px;
        }

        /* Основная область */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            background: #0d1117;
            height: 100vh;
            overflow: hidden;
        }

        /* Шапка */
        .header {
            padding: 10px 16px;
            background: #161b22;
            border-bottom: 1px solid #2a2f3a;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
            min-height: 52px;
        }
        .header .menu-btn {
            background: none;
            border: none;
            color: #e0e0e0;
            font-size: 24px;
            cursor: pointer;
            padding: 0 4px;
            display: none;
        }
        .header .logo {
            font-size: clamp(18px, 4vw, 24px);
            font-weight: 700;
            background: linear-gradient(135deg, #00d4ff, #7b2ffc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-right: auto;
            white-space: nowrap;
        }
        .header .online {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #4caf50;
            font-size: 12px;
            margin-right: 6px;
        }
        .header .online::before {
            content: '';
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4caf50;
            display: inline-block;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 0.4; transform: scale(0.9); }
            50% { opacity: 1; transform: scale(1.2); }
            100% { opacity: 0.4; transform: scale(0.9); }
        }
        .header .btn-icon {
            background: none;
            border: none;
            color: #8892a8;
            font-size: 20px;
            cursor: pointer;
            padding: 4px;
            border-radius: 6px;
        }
        .header .btn-icon:hover { background: #2a2f3a; color: #e0e0e0; }
        .header .google-btn {
            background: none;
            border: 1px solid #2a2f3a;
            border-radius: 20px;
            padding: 3px 10px;
            color: #c0c8d8;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* Чат — растягивается на всю высоту */
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px 16px 8px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #0d1117;
            scroll-behavior: smooth;
            min-height: 0;
        }
        .messages::-webkit-scrollbar { width: 6px; }
        .messages::-webkit-scrollbar-track { background: #161b22; }
        .messages::-webkit-scrollbar-thumb { background: #2a2f3a; border-radius: 10px; }

        /* Сообщения */
        .message {
            display: flex;
            gap: 10px;
            max-width: 100%;
            animation: fadeIn 0.25s ease;
        }
        .message.user { align-self: flex-end; flex-direction: row-reverse; }
        .message.assistant { align-self: flex-start; }

        .message .avatar {
            width: clamp(30px, 6vw, 38px);
            height: clamp(30px, 6vw, 38px);
            border-radius: 50%;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(16px, 3vw, 20px);
            background: #2a2f3a;
            color: #c0c8d8;
        }
        .message.user .avatar {
            background: linear-gradient(135deg, #00d4ff, #7b2ffc);
            color: #fff;
        }
        .message .bubble {
            background: #161b22;
            padding: clamp(8px, 1.5vw, 14px) clamp(12px, 2vw, 18px);
            border-radius: 16px;
            border-top-left-radius: 4px;
            word-wrap: break-word;
            line-height: 1.5;
            font-size: clamp(14px, 2.2vw, 16px);
            box-shadow: 0 1px 4px rgba(0,0,0,0.4);
            color: #e0e0e0;
            max-width: 88vw;
        }
        .message.user .bubble {
            background: #1c2333;
            border-top-left-radius: 16px;
            border-top-right-radius: 4px;
        }
        .message .bubble pre {
            background: #0d1117;
            border-radius: 8px;
            padding: 10px 14px;
            overflow-x: auto;
            margin: 8px 0;
            border: 1px solid #2a2f3a;
        }
        .message .bubble code {
            font-family: monospace;
            background: #0d1117;
            padding: 2px 6px;
            border-radius: 4px;
        }
        .message .bubble pre code {
            background: transparent;
            padding: 0;
        }
        .message .bubble blockquote {
            border-left: 3px solid #7b2ffc;
            margin: 8px 0;
            padding: 4px 14px;
            color: #c0c8d8;
        }
        .message .bubble table {
            border-collapse: collapse;
            width: 100%;
            margin: 8px 0;
        }
        .message .bubble th, .message .bubble td {
            border: 1px solid #2a2f3a;
            padding: 6px 10px;
            text-align: left;
        }
        .message .bubble th { background: #1c2333; }
        .message .bubble ul, .message .bubble ol { padding-left: 20px; margin: 6px 0; }
        .message .bubble h1, .message .bubble h2, .message .bubble h3 { margin: 10px 0 6px; }
        .message .bubble h1 { font-size: 1.5em; }
        .message .bubble h2 { font-size: 1.3em; }
        .message .bubble h3 { font-size: 1.1em; }

        .message .sources {
            font-size: 12px;
            color: #6a7a8a;
            margin-top: 6px;
            border-top: 1px solid #2a2f3a;
            padding-top: 6px;
        }
        .message .sources a {
            color: #7b2ffc;
            text-decoration: none;
            margin-right: 6px;
        }
        .message .sources a:hover { text-decoration: underline; }

        .typing {
            display: flex;
            gap: 8px;
            align-items: center;
            padding: 8px 14px;
            background: #161b22;
            border-radius: 30px;
            width: fit-content;
        }
        .typing span {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: #6a7a8a;
            display: inline-block;
            animation: typingBounce 1.2s infinite;
        }
        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typingBounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-10px); }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Поле ввода — прижато к низу */
        .input-area {
            padding: 10px 16px 14px;
            background: #0d1117;
            border-top: 1px solid #2a2f3a;
            display: flex;
            gap: 10px;
            align-items: center;
            flex-shrink: 0;
            min-height: 56px;
        }
        .input-area textarea {
            flex: 1;
            background: #161b22;
            border: 1px solid #2a2f3a;
            border-radius: 30px;
            padding: 10px 16px;
            color: #e0e0e0;
            font-size: clamp(14px, 2vw, 16px);
            resize: none;
            outline: none;
            font-family: inherit;
            transition: 0.2s;
            max-height: 120px;
            min-height: 42px;
            line-height: 1.4;
        }
        .input-area textarea:focus {
            border-color: #7b2ffc;
            background: #1c2333;
        }
        .input-area textarea::placeholder { color: #6a7a8a; }
        .input-area button {
            background: linear-gradient(135deg, #00d4ff, #7b2ffc);
            border: none;
            border-radius: 30px;
            padding: 0 20px;
            font-weight: 600;
            color: #fff;
            font-size: clamp(14px, 2vw, 16px);
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
            min-height: 42px;
        }
        .input-area button:hover { transform: scale(1.04); opacity: 0.9; }
        .input-area button:disabled { opacity: 0.5; pointer-events: none; }

        /* Модалка */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(6px);
        }
        .modal-overlay.open { display: flex; }
        .modal {
            background: #161b22;
            border-radius: 20px;
            padding: 24px 28px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            border: 1px solid #2a2f3a;
        }
        .modal h2 { font-size: 20px; margin-bottom: 14px; }
        .modal .close-btn {
            float: right;
            background: none;
            border: none;
            color: #6a7a8a;
            font-size: 22px;
            cursor: pointer;
        }
        .modal .close-btn:hover { color: #e0e0e0; }
        .color-options {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 10px;
        }
        .color-options .color-item {
            width: 42px; height: 42px;
            border-radius: 50%;
            border: 3px solid transparent;
            cursor: pointer;
            transition: 0.2s;
        }
        .color-options .color-item:hover { transform: scale(1.1); }
        .color-options .color-item.active { border-color: #fff; }

        /* Адаптив */
        @media (max-width: 700px) {
            .sidebar {
                position: fixed;
                top: 0;
                left: 0;
                height: 100%;
                z-index: 100;
                transform: translateX(-100%);
                transition: transform 0.25s ease;
                box-shadow: 2px 0 12px rgba(0,0,0,0.6);
            }
            .sidebar.open { transform: translateX(0); }
            .sidebar-overlay {
                display: none;
                position: fixed;
                top: 0; left: 0;
                width: 100%; height: 100%;
                background: rgba(0,0,0,0.4);
                z-index: 99;
            }
            .sidebar-overlay.open { display: block; }
            .header .menu-btn { display: block; }
            .header .logo { font-size: 18px; }
            .messages { padding: 12px 12px 8px; }
            .message .bubble { max-width: 92vw; }
        }
        @media (min-width: 701px) {
            .header .menu-btn { display: none; }
            .sidebar { transform: translateX(0) !important; position: relative; box-shadow: none; }
            .sidebar-overlay { display: none !important; }
        }
    </style>
</head>
<body>
<div class="app">
    <!-- Сайдбар -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <span class="logo-small">OUTPUTEX</span>
            <button class="new-chat-btn" id="newChatBtnSidebar">+ Новый</button>
        </div>
        <div class="sidebar-history" id="sidebarHistory"></div>
    </div>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- Основная область -->
    <div class="main">
        <div class="header">
            <button class="menu-btn" id="menuBtn">☰</button>
            <span class="logo">OUTPUTEX AI</span>
            <span class="online">Онлайн</span>
            <button class="btn-icon" id="settingsBtn" title="Настройки">⚙️</button>
            <button class="google-btn" id="googleLoginBtn"><span>🔑</span> Войти</button>
        </div>

        <!-- Чат (растягивается) -->
        <div class="messages" id="messages"></div>

        <!-- Поле ввода -->
        <div class="input-area">
            <textarea id="question" rows="1" placeholder="Спросите что угодно..."></textarea>
            <button id="sendBtn">Отправить</button>
        </div>
    </div>
</div>

<!-- Модалка настроек -->
<div class="modal-overlay" id="settingsModal">
    <div class="modal">
        <button class="close-btn" id="settingsClose">&times;</button>
        <h2>Настройки</h2>
        <p style="color: #6a7a8a; margin-bottom: 12px;">Выберите цветовую тему:</p>
        <div class="color-options" id="colorOptions">
            <div class="color-item active" data-theme="purple" style="background: linear-gradient(135deg, #00d4ff, #7b2ffc);"></div>
            <div class="color-item" data-theme="red" style="background: linear-gradient(135deg, #ff6b6b, #ee5a24);"></div>
            <div class="color-item" data-theme="blue" style="background: linear-gradient(135deg, #4facfe, #00f2fe);"></div>
            <div class="color-item" data-theme="green" style="background: linear-gradient(135deg, #43e97b, #38f9d7);"></div>
            <div class="color-item" data-theme="orange" style="background: linear-gradient(135deg, #f7971e, #ffd200);"></div>
            <div class="color-item" data-theme="pink" style="background: linear-gradient(135deg, #f5576c, #f093fb);"></div>
        </div>
    </div>
</div>

<script>
    // ===== ЭЛЕМЕНТЫ =====
    const messagesDiv = document.getElementById('messages');
    const questionInput = document.getElementById('question');
    const sendBtn = document.getElementById('sendBtn');
    const newChatBtnSidebar = document.getElementById('newChatBtnSidebar');
    const settingsBtn = document.getElementById('settingsBtn');
    const googleLoginBtn = document.getElementById('googleLoginBtn');
    const sidebarHistory = document.getElementById('sidebarHistory');
    const menuBtn = document.getElementById('menuBtn');
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebarOverlay');
    const settingsModal = document.getElementById('settingsModal');
    const settingsClose = document.getElementById('settingsClose');
    const colorOptions = document.getElementById('colorOptions');

    let currentChatId = Date.now();
    let isLoggedIn = false;

    // ===== ТЕМА =====
    function loadTheme() {
        const saved = localStorage.getItem('outputex_theme');
        if (saved) {
            document.body.className = 'theme-' + saved;
            document.querySelectorAll('.color-item').forEach(el => {
                el.classList.toggle('active', el.dataset.theme === saved);
            });
        }
    }
    loadTheme();

    function setTheme(theme) {
        document.body.className = 'theme-' + theme;
        localStorage.setItem('outputex_theme', theme);
        document.querySelectorAll('.color-item').forEach(el => {
            el.classList.toggle('active', el.dataset.theme === theme);
        });
    }

    // ===== РАБОТА С ИСТОРИЕЙ =====
    function getChats() {
        return JSON.parse(localStorage.getItem('outputex_history_chats') || '{}');
    }

    function saveChats(chats) {
        localStorage.setItem('outputex_history_chats', JSON.stringify(chats));
    }

    function saveChatToHistory(chatId) {
        const messages = document.querySelectorAll('.message');
        if (messages.length === 0) return;
        const chatMessages = [];
        messages.forEach(el => {
            const sender = el.classList.contains('user') ? 'user' : 'assistant';
            const bubble = el.querySelector('.bubble');
            if (!bubble) return;
            const clone = bubble.cloneNode(true);
            const src = clone.querySelector('.sources');
            if (src) src.remove();
            const text = clone.textContent.trim();
            if (!text) return;
            const sources = [];
            el.querySelectorAll('.sources a').forEach(a => {
                sources.push({ title: a.textContent, url: a.href });
            });
            chatMessages.push({ text, sender, sources });
        });
        if (chatMessages.length === 0) return;
        const firstUser = chatMessages.find(m => m.sender === 'user');
        let title = firstUser ? firstUser.text.slice(0, 40) : 'Новый чат';
        if (title.length === 40) title += '...';
        if (!title.trim()) title = 'Новый чат';

        let chats = getChats();
        if (!chats[chatId]) {
            chats[chatId] = {
                title: title,
                messages: chatMessages,
                date: new Date().toISOString(),
                count: chatMessages.length,
                pinned: false
            };
        } else {
            chats[chatId].messages = chatMessages;
            chats[chatId].count = chatMessages.length;
            chats[chatId].date = new Date().toISOString();
        }
        saveChats(chats);
        localStorage.setItem('outputex_last_chat_id', chatId);
        renderSidebarHistory();
    }

    function loadChatFromHistory(chatId) {
        const chats = getChats();
        const chat = chats[chatId];
        if (!chat) return false;
        messagesDiv.innerHTML = '';
        chat.messages.forEach(msg => {
            renderMessage(msg.text, msg.sender, msg.sources || []);
        });
        currentChatId = chatId;
        renderSidebarHistory();
        if (window.innerWidth <= 700) {
            sidebar.classList.remove('open');
            overlay.classList.remove('open');
        }
        return true;
    }

    function renderMessage(text, sender, sources = []) {
        const div = document.createElement('div');
        div.className = `message ${sender}`;
        const avatar = document.createElement('div');
        avatar.className = 'avatar';
        avatar.textContent = sender === 'user' ? '🧑' : '🤖';
        const bubble = document.createElement('div');
        bubble.className = 'bubble';

        try {
            const htmlContent = marked.parse(text);
            bubble.innerHTML = htmlContent;
        } catch (e) {
            bubble.textContent = text;
        }

        if (sources && sources.length) {
            const srcDiv = document.createElement('div');
            srcDiv.className = 'sources';
            srcDiv.innerHTML = '📎 ' + sources.map(s => `<a href="${s.url}" target="_blank">${s.title}</a>`).join(' ');
            bubble.appendChild(srcDiv);
        }
        div.appendChild(avatar);
        div.appendChild(bubble);
        messagesDiv.appendChild(div);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
        saveChatToHistory(currentChatId);
    }

    // ===== ГРУППИРОВКА ИСТОРИИ =====
    function getDateGroup(dateString) {
        const now = new Date();
        const date = new Date(dateString);
        const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        const yesterday = new Date(today);
        yesterday.setDate(yesterday.getDate() - 1);
        const weekAgo = new Date(today);
        weekAgo.setDate(weekAgo.getDate() - 7);
        const monthAgo = new Date(today);
        monthAgo.setDate(monthAgo.getDate() - 30);

        if (date >= today) return 'Сегодня';
        if (date >= yesterday) return 'Вчера';
        if (date >= weekAgo) return '7 дней';
        if (date >= monthAgo) return '30 дней';
        return 'Давно';
    }

    function renderSidebarHistory() {
        const chats = getChats();
        const keys = Object.keys(chats);
        if (keys.length === 0) {
            sidebarHistory.innerHTML = '<div class="sidebar-empty">Нет диалогов<br>Начните новый чат</div>';
            return;
        }

        keys.sort((a, b) => {
            if (chats[a].pinned && !chats[b].pinned) return -1;
            if (!chats[a].pinned && chats[b].pinned) return 1;
            return new Date(chats[b].date) - new Date(chats[a].date);
        });

        const pinnedItems = [];
        const groups = { 'Сегодня': [], 'Вчера': [], '7 дней': [], '30 дней': [], 'Давно': [] };
        keys.forEach(key => {
            const chat = chats[key];
            if (chat.pinned) pinnedItems.push({ key, chat });
            else {
                const group = getDateGroup(chat.date);
                if (groups[group]) groups[group].push({ key, chat });
                else groups['Давно'].push({ key, chat });
            }
        });

        let html = '';
        if (pinnedItems.length > 0) {
            html += `<div class="history-group"><div class="group-title">📌 Закреплённые</div>`;
            pinnedItems.forEach(({ key, chat }) => {
                html += buildHistoryItem(key, chat);
            });
            html += `</div>`;
        }

        const order = ['Сегодня', 'Вчера', '7 дней', '30 дней', 'Давно'];
        order.forEach(groupName => {
            const items = groups[groupName];
            if (!items || items.length === 0) return;
            html += `<div class="history-group"><div class="group-title">${groupName}</div>`;
            items.forEach(({ key, chat }) => {
                html += buildHistoryItem(key, chat);
            });
            html += `</div>`;
        });

        sidebarHistory.innerHTML = html;

        sidebarHistory.querySelectorAll('.history-item .title').forEach(el => {
            el.addEventListener('click', function(e) {
                e.stopPropagation();
                const id = this.closest('.history-item').dataset.id;
                loadChatFromHistory(id);
            });
        });

        sidebarHistory.querySelectorAll('.history-item .menu-btn').forEach(btn => {
            btn.addEventListener('click', function(e) {
                e.stopPropagation();
                const id = this.closest('.history-item').dataset.id;
                toggleMenu(id, e);
            });
        });

        sidebarHistory.querySelectorAll('.dropdown-menu .menu-item').forEach(item => {
            item.addEventListener('click', function(e) {
                e.stopPropagation();
                const id = this.closest('.dropdown-menu').dataset.id;
                const action = this.dataset.action;
                switch (action) {
                    case 'rename': renameChat(id); break;
                    case 'pin': togglePinChat(id); break;
                    case 'share': shareChat(id); break;
                    case 'delete': deleteChat(id); break;
                }
            });
        });
    }

    function buildHistoryItem(key, chat) {
        const active = (key == currentChatId) ? 'active' : '';
        return `<div class="history-item ${active}" data-id="${key}">
            <span class="title">${chat.title}</span>
            <span class="meta">${chat.count || chat.messages.length}</span>
            <button class="menu-btn">⋯</button>
            <div class="dropdown-menu" data-id="${key}">
                <div class="menu-item" data-action="rename"><span>✏️</span> Переименовать</div>
                <div class="menu-item" data-action="pin"><span>📌</span> ${chat.pinned ? 'Открепить' : 'Закрепить'}</div>
                <div class="menu-item" data-action="share"><span>📤</span> Поделиться</div>
                <div class="menu-item danger" data-action="delete"><span>🗑️</span> Удалить</div>
            </div>
        </div>`;
    }

    // ===== УПРАВЛЕНИЕ ДИАЛОГАМИ =====
    function deleteChat(chatId) {
        if (!confirm('Удалить этот диалог?')) return;
        let chats = getChats();
        delete chats[chatId];
        saveChats(chats);
        if (currentChatId == chatId) {
            messagesDiv.innerHTML = '';
            currentChatId = Date.now();
            renderMessage('Привет! Я OUTPUTEX AI. Задайте вопрос, и я найду информацию в интернете.', 'assistant');
        }
        renderSidebarHistory();
        closeAllMenus();
    }

    function renameChat(chatId) {
        let chats = getChats();
        const chat = chats[chatId];
        if (!chat) return;
        const newTitle = prompt('Введите новое название:', chat.title);
        if (newTitle === null || newTitle.trim() === '') return;
        chat.title = newTitle.trim();
        saveChats(chats);
        renderSidebarHistory();
        closeAllMenus();
    }

    function togglePinChat(chatId) {
        let chats = getChats();
        const chat = chats[chatId];
        if (!chat) return;
        chat.pinned = !chat.pinned;
        saveChats(chats);
        renderSidebarHistory();
        closeAllMenus();
    }

    function shareChat(chatId) {
        const chats = getChats();
        const chat = chats[chatId];
        if (!chat || !chat.messages) return;
        let text = '🔹 OUTPUTEX AI — Диалог\n\n';
        chat.messages.forEach(msg => {
            const sender = msg.sender === 'user' ? '🧑 Вы' : '🤖 OUTPUTEX AI';
            text += `${sender}:\n${msg.text}\n\n`;
        });
        navigator.clipboard.writeText(text).then(() => alert('Диалог скопирован!'));
        closeAllMenus();
    }

    // ===== ВЫПАДАЮЩЕЕ МЕНЮ =====
    function toggleMenu(chatId, event) {
        event.stopPropagation();
        document.querySelectorAll('.dropdown-menu.open').forEach(m => {
            if (m.dataset.id !== chatId) m.classList.remove('open');
        });
        const menu = document.querySelector(`.dropdown-menu[data-id="${chatId}"]`);
        if (menu) menu.classList.toggle('open');
    }

    function closeAllMenus() {
        document.querySelectorAll('.dropdown-menu.open').forEach(m => m.classList.remove('open'));
    }

    document.addEventListener('click', function(e) {
        if (!e.target.closest('.history-item')) closeAllMenus();
    });

    // ===== НОВЫЙ ЧАТ =====
    function newChat() {
        if (messagesDiv.children.length > 0) saveChatToHistory(currentChatId);
        messagesDiv.innerHTML = '';
        currentChatId = Date.now();
        renderMessage('Привет! Я OUTPUTEX AI. Задайте вопрос, и я найду информацию в интернете.', 'assistant');
        renderSidebarHistory();
        closeAllMenus();
        if (window.innerWidth <= 700) {
            sidebar.classList.remove('open');
            overlay.classList.remove('open');
        }
    }

    // ===== ПЕЧАТАНИЕ =====
    function showTyping() {
        const div = document.createElement('div');
        div.className = 'message assistant';
        div.id = 'typingIndicator';
        const avatar = document.createElement('div');
        avatar.className = 'avatar';
        avatar.textContent = '🤖';
        const bubble = document.createElement('div');
        bubble.className = 'bubble typing';
        bubble.innerHTML = '<span></span><span></span><span></span>';
        div.appendChild(avatar);
        div.appendChild(bubble);
        messagesDiv.appendChild(div);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function hideTyping() {
        const el = document.getElementById('typingIndicator');
        if (el) el.remove();
    }

    // ===== ОТПРАВКА =====
    async function sendQuestion() {
        const q = questionInput.value.trim();
        if (!q) return;
        renderMessage(q, 'user');
        questionInput.value = '';
        questionInput.style.height = 'auto';
        sendBtn.disabled = true;
        sendBtn.textContent = '⏳';
        showTyping();
        try {
            const response = await fetch('/ask', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ question: q })
            });
            const data = await response.json();
            hideTyping();
            if (data.error) {
                renderMessage('❌ Ошибка: ' + data.error, 'assistant');
            } else {
                renderMessage(data.answer || 'Ответ не получен.', 'assistant', data.sources || []);
            }
        } catch (err) {
            hideTyping();
            renderMessage('❌ Ошибка соединения с сервером.', 'assistant');
        } finally {
            sendBtn.disabled = false;
            sendBtn.textContent = 'Отправить';
            questionInput.focus();
        }
    }

    // ===== ВХОД GOOGLE (ДЕМО) =====
    function googleLogin() {
        if (isLoggedIn) {
            isLoggedIn = false;
            googleLoginBtn.innerHTML = '<span>🔑</span> Войти';
            alert('Вы вышли из аккаунта (демо).');
            return;
        }
        isLoggedIn = true;
        const name = prompt('Введите ваше имя (демо):') || 'Пользователь';
        googleLoginBtn.innerHTML = '<span>✅</span> ' + name;
        alert('Добро пожаловать, ' + name + '! (демо-вход)');
    }

    // ===== УПРАВЛЕНИЕ САЙДБАРОМ =====
    function toggleSidebar() {
        sidebar.classList.toggle('open');
        overlay.classList.toggle('open');
    }

    // ===== СОБЫТИЯ =====
    sendBtn.addEventListener('click', sendQuestion);
    questionInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendQuestion();
        }
    });
    questionInput.addEventListener('input', () => {
        questionInput.style.height = 'auto';
        questionInput.style.height = questionInput.scrollHeight + 'px';
    });

    newChatBtnSidebar.addEventListener('click', newChat);
    settingsBtn.addEventListener('click', () => settingsModal.classList.add('open'));
    settingsClose.addEventListener('click', () => settingsModal.classList.remove('open'));
    settingsModal.addEventListener('click', (e) => {
        if (e.target === settingsModal) settingsModal.classList.remove('open');
    });

    colorOptions.addEventListener('click', (e) => {
        const el = e.target.closest('.color-item');
        if (!el) return;
        setTheme(el.dataset.theme);
        settingsModal.classList.remove('open');
    });

    googleLoginBtn.addEventListener('click', googleLogin);
    menuBtn.addEventListener('click', toggleSidebar);
    overlay.addEventListener('click', toggleSidebar);

    // ===== ИНИЦИАЛИЗАЦИЯ =====
    const savedChatId = localStorage.getItem('outputex_last_chat_id');
    if (savedChatId && loadChatFromHistory(savedChatId)) {
        // загружено
    } else {
        renderMessage('Привет! Я OUTPUTEX AI. Задайте вопрос, и я найду информацию в интернете.', 'assistant');
    }
    renderSidebarHistory();
    questionInput.focus();
</script>
</body>
</html>
