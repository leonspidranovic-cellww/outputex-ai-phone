<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OUTPUTEX AI</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; overflow: hidden; font-family: 'Segoe UI', system-ui, sans-serif; background: #0b0e14; color: #e0e0e0; }
        .app { display: flex; height: 100vh; width: 100vw; background: #0d1117; }

        /* ШАПКА — яркая, чтобы точно увидеть */
        .header {
            background: #ff4444; /* временно красный, чтобы сразу заметить */
            padding: 12px 16px;
            display: flex !important;
            align-items: center;
            gap: 10px;
            border-bottom: 2px solid #fff;
            min-height: 56px;
            flex-shrink: 0;
            visibility: visible !important;
            opacity: 1 !important;
            position: relative;
            z-index: 20;
        }
        .header .logo {
            font-size: 20px;
            font-weight: 700;
            color: #fff;
            margin-right: auto;
        }
        .header .online {
            color: #8f8;
            font-size: 14px;
        }
        .header button {
            background: #333;
            border: none;
            color: #fff;
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
        }

        /* Сайдбар (упрощённый) */
        .sidebar {
            width: 260px;
            background: #161b22;
            border-right: 1px solid #2a2f3a;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            overflow: hidden;
            transition: transform 0.25s ease;
            transform: translateX(0);
            z-index: 10;
        }
        .sidebar-header {
            padding: 14px 16px;
            border-bottom: 1px solid #2a2f3a;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .sidebar-header .logo-small {
            font-size: 18px;
            font-weight: 700;
            background: linear-gradient(135deg, #00d4ff, #7b2ffc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .sidebar-header .new-chat-btn {
            margin-left: auto;
            background: #2a2f3a;
            border: none;
            border-radius: 30px;
            color: #c0c8d8;
            padding: 4px 14px;
            cursor: pointer;
        }
        .sidebar-history {
            flex: 1;
            overflow-y: auto;
            padding: 12px 10px;
        }
        .sidebar-empty {
            color: #6a7a8a;
            text-align: center;
            padding: 30px 0;
        }
        .history-item {
            padding: 6px 10px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 2px;
            color: #c0c8d8;
        }
        .history-item:hover { background: #2a2f3a; }

        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            background: #0d1117;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            display: flex;
            gap: 10px;
            max-width: 100%;
        }
        .message.user { align-self: flex-end; flex-direction: row-reverse; }
        .message.assistant { align-self: flex-start; }
        .message .avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: #2a2f3a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: #c0c8d8;
        }
        .message.user .avatar {
            background: linear-gradient(135deg, #00d4ff, #7b2ffc);
            color: #fff;
        }
        .message .bubble {
            background: #161b22;
            padding: 10px 16px;
            border-radius: 16px;
            border-top-left-radius: 4px;
            max-width: 80vw;
            line-height: 1.5;
            font-size: 15px;
        }
        .message.user .bubble {
            background: #1c2333;
            border-top-left-radius: 16px;
            border-top-right-radius: 4px;
        }
        .input-area {
            padding: 10px 16px 14px;
            border-top: 1px solid #2a2f3a;
            display: flex;
            gap: 10px;
            background: #0d1117;
        }
        .input-area textarea {
            flex: 1;
            background: #161b22;
            border: 1px solid #2a2f3a;
            border-radius: 30px;
            padding: 10px 16px;
            color: #e0e0e0;
            font-size: 15px;
            resize: none;
            outline: none;
            min-height: 44px;
        }
        .input-area button {
            background: linear-gradient(135deg, #00d4ff, #7b2ffc);
            border: none;
            border-radius: 30px;
            padding: 0 24px;
            font-weight: 600;
            color: #fff;
            cursor: pointer;
            font-size: 15px;
        }
        @media (max-width: 700px) {
            .sidebar {
                position: fixed;
                top: 0;
                left: 0;
                height: 100%;
                z-index: 100;
                transform: translateX(-100%);
                transition: transform 0.25s ease;
                box-shadow: 2px 0 12px rgba(0,0,0,0.6);
            }
            .sidebar.open { transform: translateX(0); }
            .sidebar-overlay {
                display: none;
                position: fixed;
                top: 0; left: 0;
                width: 100%; height: 100%;
                background: rgba(0,0,0,0.4);
                z-index: 99;
            }
            .sidebar-overlay.open { display: block; }
            .header .menu-btn { display: block; }
        }
        @media (min-width: 701px) {
            .header .menu-btn { display: none; }
            .sidebar { transform: translateX(0) !important; position: relative; box-shadow: none; }
            .sidebar-overlay { display: none !important; }
        }
    </style>
</head>
<body>
<div class="app">
    <!-- Сайдбар -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <span class="logo-small">OUTPUTEX</span>
            <button class="new-chat-btn" id="newChatBtnSidebar">+ Новый</button>
        </div>
        <div class="sidebar-history" id="sidebarHistory">
            <div class="sidebar-empty">Нет диалогов</div>
        </div>
    </div>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- Основная область -->
    <div class="main">
        <!-- ===== ШАПКА С ЯРКИМ ФОНОМ (временно красный) ===== -->
        <div class="header" id="header">
            <button class="menu-btn" id="menuBtn" style="background:transparent; font-size:24px; color:#fff;">☰</button>
            <span class="logo">OUTPUTEX AI</span>
            <span class="online">🟢 Онлайн</span>
            <button id="settingsBtn">⚙️</button>
            <button id="googleLoginBtn">🔑 Войти</button>
        </div>

        <!-- Чат -->
        <div class="messages" id="messages"></div>

        <!-- Поле ввода -->
        <div class="input-area">
            <textarea id="question" rows="1" placeholder="Спросите что угодно..."></textarea>
            <button id="sendBtn">Отправить</button>
        </div>
    </div>
</div>

<script>
    // ===== МИНИМАЛЬНАЯ ЛОГИКА ДЛЯ РАБОТЫ =====
    const messagesDiv = document.getElementById('messages');
    const questionInput = document.getElementById('question');
    const sendBtn = document.getElementById('sendBtn');
    const menuBtn = document.getElementById('menuBtn');
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebarOverlay');

    // Функция добавления сообщения
    function addMessage(text, sender) {
        const div = document.createElement('div');
        div.className = `message ${sender}`;
        const avatar = document.createElement('div');
        avatar.className = 'avatar';
        avatar.textContent = sender === 'user' ? '🧑' : '🤖';
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.textContent = text;
        div.appendChild(avatar);
        div.appendChild(bubble);
        messagesDiv.appendChild(div);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    // Приветствие
    addMessage('Привет! Я OUTPUTEX AI. Задайте вопрос, и я найду информацию в интернете.', 'assistant');

    // Отправка
    sendBtn.addEventListener('click', async () => {
        const q = questionInput.value.trim();
        if (!q) return;
        addMessage(q, 'user');
        questionInput.value = '';
        sendBtn.disabled = true;
        sendBtn.textContent = '⏳';
        try {
            const response = await fetch('/ask', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ question: q })
            });
            const data = await response.json();
            if (data.error) {
                addMessage('❌ Ошибка: ' + data.error, 'assistant');
            } else {
                addMessage(data.answer || 'Ответ не получен.', 'assistant');
            }
        } catch (e) {
            addMessage('❌ Ошибка соединения.', 'assistant');
        }
        sendBtn.disabled = false;
        sendBtn.textContent = 'Отправить';
    });

    // Сайдбар
    function toggleSidebar() {
        sidebar.classList.toggle('open');
        overlay.classList.toggle('open');
    }
    menuBtn.addEventListener('click', toggleSidebar);
    overlay.addEventListener('click', toggleSidebar);

    // Кнопка настроек (заглушка)
    document.getElementById('settingsBtn').addEventListener('click', () => alert('Настройки будут позже'));
    document.getElementById('googleLoginBtn').addEventListener('click', () => alert('Вход через Google (демо)'));
</script>
</body>
</html>
